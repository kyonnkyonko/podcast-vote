<meta property="og:description" content="興趣使然的 Podcast 誕生。選出你最愛的前三名，投完就能看排名。">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script>
/* ============================================================
   設定區：只要改這裡就好
   ============================================================ */
const CONFIG = {
  // 節目名稱還沒定，這裡寫給朋友看的稱呼
  showLabel: "我們的新 Podcast",
  // 一句話介紹節目
  tagline: "興趣使然的 Podcast 誕生",
  // 投票截止時間（台灣時間），留空 "" 代表不截止
  deadline: "2026-11-15T23:59:59+08:00",
  // Google Apps Script 部署後的網址。留空 "" = 測試模式（票只存在自己的瀏覽器）
  apiUrl: "https://script.google.com/macros/s/AKfycbwqPbZWbi9uDnH7FLNYvgaIu6loHj1ky7fXrUFxm01hqiOy7c3pi9yTmbA0TB7L_CxHxw/exec",
  // 候選名稱：name 是名字，desc 是一句說明（可留空）
  candidates: [
    { name: "1A2B", desc: "對了三格，差你一個。" },
    { name: "少在那邊", desc: "少在那邊，換個觀點。" },
    { name: "Yes! 怪人", desc: "怪得有理，怪可愛的。" }
  ]
};
</script>
<style>
/* 版面概念：像素遊戲的選角畫面；一頁一步、方塊邊框、硬陰影、底部固定送出列 */
@font-face {
  font-family: "Cubic 11";
  src: url("https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@1.500/fonts/web/Cubic_11.woff2") format("woff2");
  font-display: swap;
}
/* 配色依 Cru Brand Identity Guidelines：金、灰、白為主；橘色做重點；兩種藍只少量點綴 */
:root {
  --bg: #fbfaf9;
  --grid: #efedec;
  --surface: #ffffff;
  --ink: #3d393a;          /* Cru Gray 加深，用於標題與邊框 */
  --muted: #666062;        /* Cru Gray */
  --shadow: #f9b625;       /* Cru Gold 硬陰影 */
  --accent: #f9b625;       /* Cru Gold 按鈕 */
  --on-accent: #3d393a;
  --pick: #feeec8;         /* Cru Gold 淡色，已選卡片 */
  --bar: #3eb1c8;          /* Cru Bright Blue */
  --lead: #dd7d1b;         /* Cru Orange，領先的長條 */
  --gold: #f9b625;
  --silver: #b9b4b6;       /* Cru Gray 淡色 */
  --bronze: #dd7d1b;
  --danger: #b35d0a;
  --focus: #007398;        /* Cru Deep Blue */
  --medal-ink: #3d393a;
  --font-pixel: "Cubic 11", "Noto Sans TC", "PingFang TC", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --px: 4px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1d1e; --grid: #292627; --surface: #2f2c2d; --ink: #f5f3f3; --muted: #c4bfc1;
    --shadow: #f9b625; --accent: #f9b625; --on-accent: #3d393a; --pick: #4d3f1c;
    --bar: #3eb1c8; --lead: #f0913a; --gold: #f9b625; --silver: #b9b4b6; --bronze: #dd7d1b;
    --danger: #f0913a; --focus: #3eb1c8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1d1e; --grid: #292627; --surface: #2f2c2d; --ink: #f5f3f3; --muted: #c4bfc1;
  --shadow: #f9b625; --accent: #f9b625; --on-accent: #3d393a; --pick: #4d3f1c;
  --bar: #3eb1c8; --lead: #f0913a; --gold: #f9b625; --silver: #b9b4b6; --bronze: #dd7d1b;
  --danger: #f0913a; --focus: #3eb1c8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 2px, transparent 2px),
    linear-gradient(90deg, var(--grid) 2px, transparent 2px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.65;
  padding-top: env(safe-area-inset-top, 0px);
}
[hidden] { display: none !important; }
.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 150px;
}
h1, h2 {
  font-family: var(--font-pixel); font-weight: 400; line-height: 1.35;
  text-wrap: balance; margin: 0; letter-spacing: .02em;
}
h1 { font-size: 33px; }
.phrase { display: inline-block; } /* 詞組整塊換行，不從中間斷開 */
h2 { font-size: 22px; }
p { margin: 0; }

/* 像素方塊外框：用陰影做出缺角邊框 + 往右下的硬陰影 */
.pixel {
  background: var(--surface);
  margin: var(--px);
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--ink),
    0 var(--px) 0 0 var(--ink),
    calc(-1 * var(--px)) 0 0 0 var(--ink),
    var(--px) 0 0 0 var(--ink),
    var(--px) calc(2 * var(--px)) 0 0 var(--shadow),
    calc(2 * var(--px)) var(--px) 0 0 var(--shadow);
}

.eyebrow {
  font-family: var(--font-pixel); font-size: 16px; letter-spacing: .08em; color: var(--muted);
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
}
.onair {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 2px 10px; background: var(--surface); color: var(--ink);
  box-shadow: 0 0 0 2px var(--ink);
  font-variant-numeric: tabular-nums;
}
.onair::before {
  content: ""; width: 8px; height: 8px; background: var(--lead);
  animation: blink 1s steps(1) infinite;
}
.onair.closed::before { background: var(--silver); animation: none; }
@keyframes blink { 50% { opacity: 0; } }

/* 聲波：方塊堆疊 */
.wave { display: flex; align-items: flex-end; gap: 4px; height: 44px; margin-block: 4px; }
.wave span {
  width: 8px; background: var(--gold);
  transform-origin: bottom;
  animation: bounce 1.2s steps(4) infinite;
}
@keyframes bounce { 0%,100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) {
  .wave span, .onair::before, .btn .cursor { animation: none; }
}

.stack { display: flex; flex-direction: column; gap: 18px; }
.lead { font-size: 17px; color: var(--muted); }
.howto { padding: 16px 18px; display: grid; gap: 12px; }
.howto div { display: flex; gap: 12px; align-items: center; }
.medal {
  flex: none; width: 30px; height: 30px;
  display: inline-grid; place-items: center;
  font-family: var(--font-pixel); font-size: 18px; color: var(--medal-ink);
  box-shadow: 0 0 0 2px var(--medal-ink);
}
.m1 { background: var(--gold); } .m2 { background: var(--silver); } .m3 { background: var(--bronze); }
.pts { font-family: var(--font-pixel); color: var(--muted); font-size: 15px; }
.count { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

button { font: inherit; cursor: pointer; }
.btn {
  appearance: none; border: 0; border-radius: 0;
  margin: var(--px);
  width: calc(100% - 2 * var(--px));
  padding: 12px 24px; min-height: 56px;
  font-family: var(--font-pixel); font-size: 22px; letter-spacing: .06em;
  background: var(--accent); color: var(--on-accent);
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--ink),
    0 var(--px) 0 0 var(--ink),
    calc(-1 * var(--px)) 0 0 0 var(--ink),
    var(--px) 0 0 0 var(--ink),
    var(--px) calc(2 * var(--px)) 0 0 var(--shadow),
    calc(2 * var(--px)) var(--px) 0 0 var(--shadow);
}
.btn:active:not(:disabled) {
  transform: translate(var(--px), var(--px));
  box-shadow:
    0 calc(-1 * var(--px)) 0 0 var(--ink),
    0 var(--px) 0 0 var(--ink),
    calc(-1 * var(--px)) 0 0 0 var(--ink),
    var(--px) 0 0 0 var(--ink);
}
.btn:disabled { background: var(--surface); color: var(--muted); cursor: not-allowed; }
.btn.ghost { background: var(--surface); color: var(--ink); font-size: 18px; }
.btn .cursor { display: inline-block; animation: blink 1s steps(1) infinite; }
:focus-visible { outline: 3px dashed var(--focus); outline-offset: 6px; }

/* 候選卡片 */
.cards { display: grid; gap: 20px; margin: 0; padding: 0; list-style: none; }
.card {
  appearance: none; border: 0; border-radius: 0;
  width: calc(100% - 2 * var(--px)); text-align: left;
  display: flex; gap: 14px; align-items: center;
  color: var(--ink); padding: 16px; min-height: 80px;
}
.card[aria-pressed="true"] { background: var(--pick); }
.card .slot {
  flex: none; width: 40px; height: 40px;
  display: grid; place-items: center;
  font-family: var(--font-pixel); font-size: 22px; color: var(--medal-ink);
  outline: 2px dashed var(--muted); outline-offset: -2px;
}
.card[aria-pressed="true"] .slot { outline: 0; box-shadow: 0 0 0 2px var(--medal-ink); }
.card .txt { min-width: 0; display: grid; gap: 4px; }
.card .name { font-family: var(--font-pixel); font-size: 22px; line-height: 1.3; overflow-wrap: anywhere; }
.card .desc { font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }

.field { display: grid; gap: 8px; }
.field label { font-size: 15px; color: var(--muted); }
.field input {
  font: inherit; padding: 12px 14px; border: 0; border-radius: 0;
  background: var(--surface); color: var(--ink);
  box-shadow: 0 0 0 3px var(--ink);
  margin: 3px;
}

/* 底部固定送出列 */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: var(--surface);
  box-shadow: 0 calc(-1 * var(--px)) 0 0 var(--ink);
  padding-top: 12px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.dock-inner { max-width: 560px; margin: 0 auto; display: grid; gap: 10px; }
.picked { display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--muted); min-height: 26px; }
.chip {
  display: inline-flex; gap: 4px; align-items: center;
  background: var(--pick); color: var(--ink); padding: 1px 10px;
  box-shadow: 0 0 0 2px var(--ink); margin: 2px;
}
.error { color: var(--danger); font-size: 14px; font-weight: 700; }

/* 結果：像血條一樣的分格長條 */
.board { padding: 18px; }
.results { display: grid; gap: 18px; list-style: none; margin: 0; padding: 0; }
.row { display: grid; gap: 6px; }
.row-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.row-name { font-family: var(--font-pixel); font-size: 20px; min-width: 0; overflow-wrap: anywhere; }
.row.top .row-name::after {
  content: "★ 領先"; margin-left: 10px; font-size: 14px;
  background: var(--lead); color: var(--medal-ink); padding: 0 6px; vertical-align: middle;
}
.row-num { font-family: var(--font-pixel); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; flex: none; }
.row-num b { color: var(--ink); font-size: 22px; font-weight: 400; }
.track { height: 16px; background: var(--bg); box-shadow: 0 0 0 2px var(--ink); margin: 2px; }
.bar {
  height: 100%; width: 0;
  background: repeating-linear-gradient(90deg, var(--bar) 0 10px, transparent 10px 12px);
  transition: width .8s steps(8);
}
.row.top .bar { background: repeating-linear-gradient(90deg, var(--lead) 0 10px, transparent 10px 12px); }
.row-sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.note { font-size: 14px; color: var(--muted); }
.mock {
  font-size: 13px; text-align: center; padding: 6px 12px; margin: 0 0 20px;
  background: var(--pick); color: var(--ink); box-shadow: 0 0 0 2px var(--ink);
}
</style>
</head>
<body>
<main class="wrap">
  <p class="mock" id="mockBanner" hidden>測試模式：還沒接上 Google 試算表，票只存在這台裝置。</p>

  <!-- 第 1 步：開場 -->
  <section id="intro" class="stack" style="margin-top:16px">
    <div class="eyebrow">EP.00 命名會議 <span class="onair" id="status">投票中</span></div>
    <div class="wave" aria-hidden="true" id="wave"></div>
    <h1 id="title"><span class="phrase">幫我們的</span><span class="phrase">新節目</span><span class="phrase">取個名字</span></h1>
    <p class="lead" id="tagline"></p>
    <div class="howto pixel" aria-label="怎麼投">
      <div><span class="medal m1">1</span><span>點你最愛的名字 <span class="pts">得 3 分</span></span></div>
      <div><span class="medal m2">2</span><span>再點第二喜歡的 <span class="pts">得 2 分</span></span></div>
      <div><span class="medal m3">3</span><span>最後點第三名 <span class="pts">得 1 分</span></span></div>
    </div>
    <p class="count" id="voterCount"></p>
    <button class="btn" id="startBtn" type="button"><span class="cursor" aria-hidden="true">▶</span> 開始投票</button>
  </section>

  <!-- 第 2 步：投票 -->
  <section id="vote" class="stack" hidden>
    <div class="stack" style="gap:6px">
      <h2>依序點出你的前三名</h2>
      <p class="note">再點一次可以取消。名字順序每個人看到的都不一樣。</p>
    </div>
    <ul class="cards" id="cards"></ul>
    <div class="field">
      <label for="nickname">你的暱稱（選填，方便我們謝謝你）</label>
      <input id="nickname" maxlength="30" autocomplete="nickname" placeholder="例如：小明">
    </div>
  </section>

  <!-- 第 3 步：結果 -->
  <section id="result" class="stack" hidden>
    <div class="stack" style="gap:6px">
      <div class="eyebrow" style="margin-bottom:10px"><span class="onair" id="status2">投票中</span></div>
      <h2 id="resultTitle">謝謝你的一票！</h2>
      <p class="note" id="myPicks"></p>
    </div>
    <p class="count" id="resultCount"></p>
    <div class="board pixel"><ol class="results" id="results"></ol></div>
    <p class="note">分數算法：第 1 名 3 分、第 2 名 2 分、第 3 名 1 分。同分時，比誰拿到比較多第 1 名。</p>
    <button class="btn ghost" id="refreshBtn" type="button">重新整理排名</button>
  </section>
</main>

<div class="dock" id="dock" hidden>
  <div class="dock-inner">
    <div class="picked" id="picked">還沒選，先點你最愛的名字</div>
    <p class="error" id="error" role="alert" hidden></p>
    <button class="btn" id="submitBtn" type="button" disabled>再選 3 個</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const MEDAL_CLASS = ["m1", "m2", "m3"];
// 固定用最初的截止日當名稱，延長截止時已投過的人才不會被當成沒投過
const storeKey = "podvote:2026-11-11T23:59:59+08:00";
const MOCK_KEY = "podvote-mock-rows";
const isMock = !CONFIG.apiUrl;

let picks = [];

/* ---------- 小工具 ---------- */
function load(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
function isClosed() { return !!CONFIG.deadline && Date.now() > new Date(CONFIG.deadline).getTime(); }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

/* 計分：rows 是 [[第1名, 第2名, 第3名], ...] */
function tally(rows) {
  const scores = {};
  rows.forEach((r) => r.forEach((name, i) => {
    if (!name) return;
    const s = scores[name] || (scores[name] = { points: 0, ranks: [0, 0, 0] });
    s.points += 3 - i;
    s.ranks[i]++;
  }));
  return { total: rows.length, scores };
}

/* 把統計和候選名單合併、排序 */
function ranked(results) {
  const names = CONFIG.candidates.map((c) => c.name);
  Object.keys(results.scores).forEach((n) => { if (!names.includes(n)) names.push(n); });
  return names.map((name) => {
    const s = results.scores[name] || { points: 0, ranks: [0, 0, 0] };
    return { name, points: s.points, ranks: s.ranks };
  }).sort((a, b) =>
    b.points - a.points || b.ranks[0] - a.ranks[0] || b.ranks[1] - a.ranks[1] || a.name.localeCompare(b.name, "zh-Hant"));
}

/* ---------- 跟後端溝通 ---------- */
async function fetchResults() {
  if (isMock) return tally(load(MOCK_KEY) || []);
  const res = await fetch(CONFIG.apiUrl);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "讀取失敗");
  return data.results;
}

async function sendVote(nickname) {
  if (isMock) {
    const rows = load(MOCK_KEY) || [];
    rows.push(picks.slice());
    save(MOCK_KEY, rows);
    return tally(rows);
  }
  // 用 text/plain 送出，避開 Apps Script 的跨網域限制
  const res = await fetch(CONFIG.apiUrl, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ picks, nickname })
  });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error === "closed" ? "投票已經截止了" : (data.error || "送出失敗"));
  return data.results;
}

/* ---------- 畫面 ---------- */
function statusText() {
  if (isClosed()) return "投票已截止";
  if (!CONFIG.deadline) return "投票中";
  const ms = new Date(CONFIG.deadline).getTime() - Date.now();
  const d = Math.floor(ms / 86400000), h = Math.floor(ms / 3600000) % 24;
  return d > 0 ? `還有 ${d} 天 ${h} 小時` : `剩 ${Math.max(1, Math.ceil(ms / 3600000))} 小時`;
}

function renderStatus() {
  const closed = isClosed();
  [$("status"), $("status2")].forEach((s) => { s.textContent = statusText(); s.classList.toggle("closed", closed); });
}

function renderCards() {
  const list = $("cards");
  list.replaceChildren();
  shuffle(CONFIG.candidates).forEach((c) => {
    const li = el("li");
    const b = el("button", "card pixel");
    b.type = "button";
    b.dataset.name = c.name;
    b.setAttribute("aria-pressed", "false");
    const slot = el("span", "slot");
    const txt = el("span", "txt");
    txt.append(el("span", "name", c.name));
    if (c.desc) txt.append(el("span", "desc", c.desc));
    b.append(slot, txt);
    b.addEventListener("click", () => togglePick(c.name));
    li.append(b);
    list.append(li);
  });
}

function togglePick(name) {
  const i = picks.indexOf(name);
  if (i >= 0) picks.splice(i, 1);
  else if (picks.length < 3) picks.push(name);
  else { showError("已經選滿 3 個了，先點掉一個再換"); return; }
  showError("");
  renderPicks();
}

function renderPicks() {
  document.querySelectorAll(".card").forEach((b) => {
    const i = picks.indexOf(b.dataset.name);
    const slot = b.querySelector(".slot");
    b.setAttribute("aria-pressed", i >= 0 ? "true" : "false");
    slot.className = "slot" + (i >= 0 ? " " + MEDAL_CLASS[i] : "");
    slot.textContent = i >= 0 ? String(i + 1) : "";
  });
  const box = $("picked");
  box.replaceChildren();
  if (!picks.length) box.textContent = "還沒選，先點你最愛的名字";
  picks.forEach((n, i) => box.append(el("span", "chip", `${i + 1}. ${n}`)));
  const left = 3 - picks.length;
  $("submitBtn").disabled = left > 0;
  $("submitBtn").textContent = left > 0 ? `再選 ${left} 個` : "送出我的前三名";
}

function showError(msg) { $("error").textContent = msg; $("error").hidden = !msg; }

function renderResults(results, mine) {
  const rows = ranked(results);
  const max = Math.max(1, ...rows.map((r) => r.points));
  const list = $("results");
  list.replaceChildren();
  rows.forEach((r, idx) => {
    const li = el("li", "row" + (idx === 0 && r.points > 0 ? " top" : ""));
    const head = el("div", "row-head");
    head.append(el("span", "row-name", `${idx + 1}. ${r.name}`));
    const num = el("span", "row-num");
    num.append(el("b", null, String(r.points)), " 分");
    head.append(num);
    const track = el("div", "track");
    const bar = el("div", "bar");
    track.append(bar);
    li.append(head, track, el("span", "row-sub", `第 1 名 ${r.ranks[0]} 票 · 第 2 名 ${r.ranks[1]} 票 · 第 3 名 ${r.ranks[2]} 票`));
    list.append(li);
    requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = (r.points / max * 100) + "%"; }));
  });
  $("resultCount").textContent = `目前共有 ${results.total} 位朋友投票`;
  if (mine && mine.length) $("myPicks").textContent = "你投的是：" + mine.map((n, i) => `${i + 1}. ${n}`).join("　");
  $("myPicks").hidden = !(mine && mine.length);
}

function show(step) {
  ["intro", "vote", "result"].forEach((s) => { $(s).hidden = s !== step; });
  $("dock").hidden = step !== "vote";
  window.scrollTo(0, 0);
}

async function goResult(mine) {
  $("resultTitle").textContent = isClosed() ? "投票結果出爐" : (mine ? "謝謝你的一票！" : "目前排名");
  show("result");
  try { renderResults(await fetchResults(), mine); }
  catch (e) { $("resultCount").textContent = "排名暫時讀不到，晚點再按「重新整理排名」看看。"; }
}

/* ---------- 啟動 ---------- */
function init() {
  document.title = CONFIG.showLabel + " 命名投票";
  $("tagline").textContent = CONFIG.tagline;
  $("mockBanner").hidden = !isMock;
  const wave = $("wave");
  [10, 22, 34, 18, 40, 26, 14, 30, 44, 20, 12, 28, 36, 16].forEach((h, i) => {
    const s = el("span"); s.style.height = h + "px"; s.style.animationDelay = (i * 0.08) + "s"; wave.append(s);
  });
  renderStatus();
  renderCards();
  renderPicks();

  const mine = load(storeKey);
  if (mine || isClosed()) { goResult(mine); }
  else {
    fetchResults().then((r) => {
      if (r.total > 0) $("voterCount").textContent = `已經有 ${r.total} 位朋友投過票了`;
    }).catch(() => {});
  }

  $("startBtn").addEventListener("click", () => show("vote"));
  $("refreshBtn").addEventListener("click", () => goResult(load(storeKey)));
  $("submitBtn").addEventListener("click", async () => {
    if (picks.length !== 3) return;
    const btn = $("submitBtn");
    btn.disabled = true; btn.textContent = "送出中…";
    showError("");
    try {
      const results = await sendVote($("nickname").value.trim().slice(0, 30));
      save(storeKey, picks.slice());
      $("resultTitle").textContent = "謝謝你的一票！";
      show("result");
      renderResults(results, picks);
    } catch (e) {
      showError((e && e.message ? e.message : "送出失敗") + "，請再試一次。");
      renderPicks();
    }
  });
}
init();
</script>
</body>
</html>
